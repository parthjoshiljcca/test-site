<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Student Information Form</title>
  <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet">
  <link th:href="@{/css/master.css}" rel="stylesheet">
</head>
<body>
<div class="container">
  <h1 class="text-center">Personal Information Form</h1>
  <form class="row g-3" th:action="@{/student/view}" th:object="${student}" method="post">
    <div class="col-12">
      <label class="form-label">Name</label>
      <input type="text" th:field="*{name}" class="form-control">
    </div>
    <div class="col-md-6">
      <label class="form-label">Email</label>
      <input type="email" th:field="*{emailId}" class="form-control">
    </div>
    <div class="col-md-6">
      <label class="form-label">Password</label>
      <input type="password" th:field="*{password}" class="form-control">
    </div>
    <div class="col-12">
      <label class="form-label">Address</label>
      <input type="text" th:field="*{address1}" class="form-control">
    </div>
    <div class="col-12">
      <label class="form-label">Address 2</label>
      <input type="text" th:field="*{address2}" class="form-control">
    </div>
    <div class="col-md-6">
      <label class="form-label">City</label>
      <input type="text" th:field="*{city}" class="form-control">
    </div>
    <div class="col-md-4">
      <label class="form-label">State</label>
      <select th:field="*{state}" class="form-select">
        <option value="Delhi">Delhi</option>
        <option value="Bihar">Bihar</option>
        <option value="UP">UP</option>
      </select>
    </div>
    <div class="col-md-2">
      <label class="form-label">Zip</label>
      <input type="text" th:field="*{zipCode}" class="form-control">
    </div>
    <div class="col-12 text-center">
      <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Submit</button>
    </div>
  </form>
</div>
<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
